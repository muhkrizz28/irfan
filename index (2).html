<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#effaf4;--glass:rgba(255,255,255,.72);--gb:rgba(16,148,98,.22);--text:#0c2d22;--muted:#4f7a6a;--a1:#0e9f6e;--a2:#4fd9a0;--gold:#e8a900;--field:rgba(255,255,255,.8);--shadow:0 20px 60px rgba(16,148,98,.24);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04130d;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--text:#eafff5;--muted:#a6dcc4;--a1:#1fd18b;--a2:#7cf0c0;--gold:#ffd86b;--field:rgba(255,255,255,.08);--shadow:0 20px 60px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#04130d;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--text:#eafff5;--muted:#a6dcc4;--a1:#1fd18b;--a2:#7cf0c0;--gold:#ffd86b;--field:rgba(255,255,255,.08);--shadow:0 20px 60px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;color:var(--text);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60vmax 60vmax at 10% 0%,color-mix(in srgb,var(--a1) 38%,transparent),transparent 60%),radial-gradient(50vmax 50vmax at 100% 100%,color-mix(in srgb,var(--a2) 34%,transparent),transparent 60%);z-index:0}
#bg{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(46px) saturate(1.3);opacity:0;transition:opacity 1.6s;z-index:0}
#bg.on{opacity:.5}
.glass{position:relative;z-index:2;touch-action:manipulation;width:100%;max-width:430px;background:var(--glass);border:1px solid var(--gb);border-radius:32px;padding:30px 26px;box-shadow:var(--shadow);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-align:center}
.eyebrow{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:2rem;line-height:1.2;margin:8px 0 6px}
h1 em{font-style:italic;background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
p.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
label{display:block;text-align:left;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:500}
input[type=text],input[type=date],textarea{width:100%;padding:13px 15px;border:1px solid var(--gb);border-radius:16px;background:var(--field);color:var(--text);font:inherit;font-size:.95rem;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 20%,transparent)}
textarea{resize:vertical;min-height:84px}
.file{display:flex;align-items:center;gap:10px;padding:12px 15px;border:1.5px dashed var(--gb);border-radius:16px;background:var(--field);cursor:pointer;font-size:.88rem;color:var(--muted);text-align:left}
.file:hover{border-color:var(--a1)}
.file input{display:none}
.file b{font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{margin-top:22px;width:100%;padding:15px;border-radius:999px;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;font-weight:500;font-size:1rem;letter-spacing:.04em;box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 45%,transparent);transition:transform .15s}
.btn:active{transform:scale(.98)}
.ghost{background:transparent;color:var(--muted);font-size:.8rem;margin-top:12px;padding:8px;letter-spacing:.1em;text-transform:uppercase}
#show{display:none}
.ring{width:min(72%,270px);aspect-ratio:4/5;margin:0 auto 22px;padding:4px;border-radius:999px 999px 28px 28px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 18px 50px color-mix(in srgb,var(--a1) 45%,transparent);animation:float 5s ease-in-out infinite}
.ring .in{width:100%;height:100%;border-radius:inherit;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--a1)}
.ring img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 14s ease-in-out infinite alternate}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes zoom{to{transform:scale(1.1)}}
.days{display:none;margin:2px 0 14px;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.days .num{display:block;font-family:"Playfair Display",Georgia,serif;font-size:2.4rem;letter-spacing:0;text-transform:none;background:linear-gradient(120deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
#msg{min-height:96px;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;font-size:1.18rem;line-height:1.65;white-space:pre-wrap;margin:6px 0 4px}
.rise>*{opacity:0;transform:translateY(16px);animation:in .9s forwards}
.rise>*:nth-child(2){animation-delay:.25s}.rise>*:nth-child(3){animation-delay:.5s}.rise>*:nth-child(4){animation-delay:.75s}.rise>*:nth-child(5){animation-delay:1s}
@keyframes in{to{opacity:1;transform:none}}
.player{margin-top:18px;padding:14px 16px;border-radius:22px;border:1px solid var(--gb);background:var(--field);display:flex;align-items:center;gap:14px;text-align:left}
.disc{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--bg) 0 6px,var(--a1) 7px 10px,#04140d 11px 100%);box-shadow:0 4px 14px color-mix(in srgb,var(--a1) 45%,transparent)}
.playing .disc{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:500;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{font-size:.78rem;color:var(--muted)}
.eq{display:flex;align-items:flex-end;gap:3px;height:20px;margin-top:6px}
.eq i{width:3px;height:4px;border-radius:2px;background:var(--a1);transition:height .3s}
.playing .eq i{animation:bar .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s!important}.eq i:nth-child(3){animation-delay:.3s!important}.eq i:nth-child(4){animation-delay:.45s!important}.eq i:nth-child(5){animation-delay:.6s!important}
@keyframes bar{0%,100%{height:4px}50%{height:20px}}
#pp{width:44px;height:44px;border-radius:50%;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;font-size:1rem;flex:none}
.heart{position:fixed;bottom:-40px;z-index:1;pointer-events:none;color:var(--a1);animation:fly linear forwards}
@keyframes fly{to{transform:translate(var(--dx),-115vh) rotate(30deg);opacity:0}}
.star{position:fixed;z-index:1;pointer-events:none;color:var(--gold);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.ring{cursor:pointer}
.pulse{animation:pul 1.8s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.star{animation:none;opacity:.5}.ring,.ring img,.playing .disc,.playing .eq i{animation:none}}
</style>
</head>
<body>
<div id="bg"></div>

<main class="glass" id="intro">
  <div class="eyebrow">★ A surprise for you ★</div>
  <h1>Hi, <em>My Baby Irfan</em></h1>
  <p class="sub">Someone made something special, just for you.</p>
  <button class="btn pulse" id="go">Tap to open ♥</button>
</main>

<main class="glass rise" id="show">
  <div class="ring"><div class="in" id="frame"><img id="pic" alt="Irfan" style="object-position:50% 35%"></div></div>
  <div><div class="eyebrow">★ For the one I love ★</div><h1 id="title"></h1><div class="days" id="days" style="display:block">Our special day<span class="num" style="font-size:1.8rem">1 November ♥</span></div></div>
  <div id="msg"></div>
  <div class="player" id="np">
    <div class="disc"></div>
    <div class="meta"><b id="npt">A sweet song for you</b><span id="nps">Made with love ♥</span><div class="eq"><i></i><i></i><i></i><i></i><i></i></div></div>
    <button id="pp" aria-label="Play or pause">⏸</button>
  </div>
  </main>
<audio id="audio" loop></audio>

<script>
var $=function(i){return document.getElementById(i)};
var audio=$('audio'),timer,heartTimer,picUrl,songUrl,ctx=null,boxTimer,boxOn=false,step=0;
var prog=[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]],pat=[0,1,2,1,2,1,2,1];
function setPlaying(on){$('np').classList.toggle('playing',on);$('pp').textContent=on?'⏸':'▶'}
function note(f,t,d,v){var o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.05)}
function startBox(){
  var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  stopBox();ctx=new AC();boxOn=true;step=0;setPlaying(true);
  var next=ctx.currentTime+.1;
  boxTimer=setInterval(function(){
    while(next<ctx.currentTime+.8){
      var ch=prog[Math.floor(step/8)%4],i=step%8;
      note(ch[pat[i]]*2,next,1.5,.16);
      if(i===0)note(ch[0]/2,next,3,.2);
      step++;next+=.45;
    }
  },150);
}
function stopBox(){boxOn=false;clearInterval(boxTimer);if(ctx){try{ctx.close()}catch(e){}ctx=null;setPlaying(false)}}
audio.addEventListener('play',function(){setPlaying(true)});
audio.addEventListener('pause',function(){setPlaying(false)});
function hearts(){
  var h=document.createElement('div');
  var sy=['♥','♥','★','✦','♥','✧','★'],k=sy[Math.floor(Math.random()*sy.length)];h.className='heart';h.textContent=k;if(k!=='♥')h.style.color='var(--gold)';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(12+Math.random()*28)+'px';
  h.style.opacity=.35+Math.random()*.55;
  h.style.setProperty('--dx',(Math.random()*120-60)+'px');
  h.style.animationDuration=(5+Math.random()*5)+'s';
  document.body.appendChild(h);
  setTimeout(function(){h.remove()},10500);
}
(function(){for(var i=0;i<34;i++){var s=document.createElement('div');s.className='star';s.textContent=i%3?'✦':'★';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.fontSize=(8+Math.random()*14)+'px';s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2+Math.random()*3)+'s';document.body.appendChild(s)}})();
$('frame').parentNode.onclick=function(){for(var i=0;i<30;i++)setTimeout(hearts,i*45)};
function type(text){
  var el=$('msg'),i=0;el.textContent='';clearInterval(timer);
  setTimeout(function(){timer=setInterval(function(){el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(timer)},55)},900);
}
function countUp(n){
  var el=$('dn'),c=0,inc=Math.max(1,Math.ceil(n/60));
  var t=setInterval(function(){c=Math.min(n,c+inc);el.textContent=c.toLocaleString();if(c>=n)clearInterval(t)},25);
}

$('pic').src=PHOTO;$('bg').style.backgroundImage='url('+PHOTO+')';
function openSurprise(){
  if ($('intro').style.display === 'none') return;
  // Reveal the page first so a mobile audio restriction cannot block the button.
  $('bg').classList.add('on');
  var em=document.createElement('em');em.textContent=NAME;
  $('title').appendChild(document.createTextNode('I love you, '));$('title').appendChild(em);
  $('intro').style.display='none';
  var sh=$('show');sh.style.display='block';sh.classList.remove('rise');void sh.offsetWidth;sh.classList.add('rise');
  type(MSG);
  clearInterval(heartTimer);heartTimer=setInterval(hearts,200);
  try { startBox(); } catch(e) { stopBox(); }
}
function toggleMusic(){
  try {
    if(boxOn){stopBox();return}
    if(!audio.src){startBox();return}
    var result = audio.paused ? audio.play() : audio.pause();
    if (result && typeof result.catch === 'function') result.catch(function(){});
  } catch(e) { stopBox(); }
}
// Touchend supports mobile browsers; click remains as a fallback for desktop
// and keyboard activation. Prevent the follow-up synthetic click from firing twice.
function bindTap(element, action){
  var touched = false;
  element.addEventListener('touchend', function(event){
    event.preventDefault();
    touched = true;
    action();
    setTimeout(function(){touched=false;},700);
  }, {passive:false});
  element.addEventListener('click', function(event){
    if(touched){event.preventDefault();return;}
    action();
  });
}
bindTap($('go'), openSurprise);
bindTap($('pp'), toggleMusic);
bindTap($('frame').parentNode, function(){
  for(var i=0;i<30;i++)setTimeout(hearts,i*45);
});
